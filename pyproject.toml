[project]
name = "gaap"
version = "1.0.0"
description = "GAAP - Gouvernance, Arbitrage et Audit du Prix : moteur d'experimentation tarifaire"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4.0"]

[project.urls]
Homepage = "https://www.dataoptimization.be"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:gaap.*"]

[tool.setuptools.packages.find]
include = ["gaap*"]
